on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'

name: build and test

jobs:
  build_and_test_linux:
    # pinned to match upstream CI; ubuntu-latest rolled to a newer
    # toolchain that cannot build the wgatools rust-htslib dependency
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install required packages
        run: sudo apt-get update && sudo apt-get install -y
          git
          bash
          cmake
          make
          g++
          libbz2-dev
          python3-dev
          libatomic-ops-dev
          autoconf
          libgsl-dev
          zlib1g-dev
          libdeflate-dev
          libhts-dev
          samtools
          libjemalloc-dev
          bedtools
          cargo
      - name: Install wgatools
        # --locked: the repo's Cargo.lock pins hts-sys 2.1.1 (htslib with the
        # pre-1.18 `isize` field) against rust-htslib 0.44.1; without it a fresh
        # resolution pulls hts-sys 2.2.x, which fails to compile (E0609/E0308)
        run: cargo install --locked --git https://github.com/wjwei-handsome/wgatools.git
      - name: Install pafcheck
        run: cargo install --locked --git https://github.com/ekg/pafcheck.git
      - name: Init and update submodules
        run: git submodule update --init --recursive
      - name: Build wfmash
        run: cmake -H. -Bbuild -D CMAKE_BUILD_TYPE=Debug -DWFA_PNG_AND_TSV=ON && cmake --build build -- -j 2
      - name: Run cmake tests
        run: |
          cd build
          ctest --output-on-failure

  build_and_test_macos:
    # pinned image; macos-latest (macOS 26) rolled to a newer Xcode that
    # cannot build the wgatools rust-htslib dependency
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install required packages
        run: |
          brew install cmake gcc gsl zlib samtools bedtools
          # Install Rust toolchain
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install wgatools
        # see the linux job for why --locked is required
        run: cargo install --locked --git https://github.com/wjwei-handsome/wgatools.git
      - name: Install pafcheck
        run: cargo install --locked --git https://github.com/ekg/pafcheck.git
      - name: Init and update submodules
        run: git submodule update --init --recursive
      - name: Build wfmash
        run: |
          # Use Homebrew GCC for OpenMP support (Apple clang doesn't support -fopenmp)
          GCC_VERSION=$(ls /opt/homebrew/bin/gcc-* 2>/dev/null | grep -o '[0-9]*$' | sort -rn | head -1)
          export CC=gcc-${GCC_VERSION}
          export CXX=g++-${GCC_VERSION}
          echo "Using CC=$CC CXX=$CXX"
          cmake -H. -Bbuild -DCMAKE_BUILD_TYPE=Release -DVENDOR_EVERYTHING=ON
          cmake --build build -- -j 3
      - name: Run cmake tests
        run: |
          cd build
          ctest --output-on-failure
